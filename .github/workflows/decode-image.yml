name: decode-image
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-image.yml"
      - "x/*.b64"
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG and remove temporary files
        run: |
          set -euo pipefail
          mkdir -p x
          base64 -d x/2026-11-21-rookie-vs-pro.png.b64 > x/2026-11-21-rookie-vs-pro.png
          rm -f x/2026-11-21-rookie-vs-pro.png.b64
          rm -f .github/workflows/decode-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add X post image: rookie-vs-pro"
          git push
